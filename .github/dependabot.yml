---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /src/rwifi_slam_ros2
    schedule:
      interval: monthly
    ignore:
      # 1.x removed OcTree.decayAndInsertPointCloud (octomap.use_decay); see docs/ROADMAP.md.
      - dependency-name: pyoctomap
        versions: [">=1.0.0"]
