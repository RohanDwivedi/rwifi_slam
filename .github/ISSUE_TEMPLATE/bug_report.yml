---
name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, launch arguments, and parameter changes.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal output. It's formatted automatically.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or release tag.
      placeholder: v0.13.0 or a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Dev container (Docker/compose.yaml)
        - Release image (ghcr.io)
        - Native ROS 2 Jazzy install
    validations:
      required: true
  - type: checkboxes
    id: simulator
    attributes:
      label: Simulation
      options:
        - label: The problem happens while running Isaac Sim
