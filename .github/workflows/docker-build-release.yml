name: Build and Release Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_DEV: rwifi_nvblox_slam
  ROS2_VERSION: jazzy

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  pr-check:
    name: PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check if commit should be skipped
        id: check-skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "(chore: bump version|\[skip ci\]|\[ci skip\]|\*\*\*NO_CI\*\*\*|\[no ci\])"; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set lowercase repository owner
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set registry owner path
        id: reg-owner
        run: echo "path=${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check-skip.outputs.should_skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check-skip.outputs.should_skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.check-skip.outputs.should_skip != 'true'
        env:
          GHCR_OWNER: ${{ steps.repo-owner.outputs.owner }}
          DOCKER_BUILDKIT: 1
        run: |
          chmod +x ./scripts/build-docker.sh
          ./scripts/build-docker.sh rel
          docker tag ghcr.io/${GHCR_OWNER}/${{ env.IMAGE_NAME_DEV }}:latest \
            ${{ steps.reg-owner.outputs.path }}/${{ env.IMAGE_NAME_DEV }}:test-${{ github.run_number }}

      - name: Install rosdep dependencies
        if: steps.check-skip.outputs.should_skip != 'true'
        env:
          REGISTRY_OWNER: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME_DEV }}
        run: |
          IMAGE="$REGISTRY_OWNER/$IMAGE_NAME:test-${{ github.run_number }}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            "$IMAGE" \
            bash -c "source /opt/ros/jazzy/setup.bash && \
                     rosdep update && \
                     rosdep install --from-paths src --ignore-src -r -y && \
                     sudo chown -R 1000:1000 /workspace"

      - name: Run tests
        if: steps.check-skip.outputs.should_skip != 'true'
        env:
          REGISTRY_OWNER: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME_DEV }}
        run: |
          IMAGE="$REGISTRY_OWNER/$IMAGE_NAME:test-${{ github.run_number }}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            "$IMAGE" \
            bash -c "source /opt/ros/jazzy/setup.bash && \
                     if [ -f /ros2_ws/install/setup.bash ]; then \
                       source /ros2_ws/install/setup.bash; \
                     fi && \
                     cd /ros2_ws && \
                     colcon test --packages-select rwifi_nvblox_slam_ros2 --event-handlers console_direct+ && \
                     colcon test-result --verbose"

  release:
    name: Release (merged PR only)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Pull latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set lowercase repository owner
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set registry owner path
        id: reg-owner
        run: echo "path=${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}" >> $GITHUB_OUTPUT

      - name: Determine release type from PR labels
        id: check-labels
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          if echo "$LABELS" | grep -q "Release Major"; then
            echo "release_type=major" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -qE "(^| )Release($| )"; then
            echo "release_type=minor" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "release_type=none" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not a release
        if: steps.check-labels.outputs.is_release != 'true'
        run: exit 0

      - name: Update version
        id: update-version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_XML="src/rwifi_nvblox_slam_ros2/package.xml"
          if [ ! -f "$PACKAGE_XML" ]; then
            echo "Error: package.xml not found at $PACKAGE_XML"
            exit 1
          fi

          CURRENT_VERSION=$(grep -oP '<version>\K[^<]+' "$PACKAGE_XML")
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]:-0}"

          if [ "${{ steps.check-labels.outputs.release_type }}" = "major" ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_VERSION="$NEW_MAJOR.0.0"
          else
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          fi

          sed -i "s/<version>$CURRENT_VERSION<\/version>/<version>$NEW_VERSION<\/version>/" "$PACKAGE_XML"

          SETUP_PY="src/rwifi_nvblox_slam_ros2/setup.py"
          SETUP_PY_UPDATED=false
          if [ -f "$SETUP_PY" ]; then
            SETUP_CURRENT_VERSION=$(grep -oP 'version="\K[^"]+' "$SETUP_PY" || true)
            if [ -n "$SETUP_CURRENT_VERSION" ]; then
              sed -i "s/version=\"$SETUP_CURRENT_VERSION\"/version=\"$NEW_VERSION\"/" "$SETUP_PY"
              grep -q "version=\"$NEW_VERSION\"" "$SETUP_PY"
              SETUP_PY_UPDATED=true
            fi
          fi

          IFS='.' read -ra NEW_VERSION_PARTS <<< "$NEW_VERSION"
          NEW_MAJOR="${NEW_VERSION_PARTS[0]}"
          NEW_MINOR="${NEW_VERSION_PARTS[1]}"
          DOCKER_TAG="${{ env.IMAGE_NAME_DEV }}-${{ env.ROS2_VERSION }}-$NEW_MAJOR.$NEW_MINOR"

          echo "setup_py_updated=$SETUP_PY_UPDATED" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Commit version updates to main
        id: commit-version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/rwifi_nvblox_slam_ros2/package.xml
          if [ "${{ steps.update-version.outputs.setup_py_updated }}" = "true" ]; then
            git add src/rwifi_nvblox_slam_ros2/setup.py
          fi
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.update-version.outputs.new_version }} [skip ci]"
          git push origin main
          echo "new_commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          GHCR_OWNER: ${{ steps.repo-owner.outputs.owner }}
          DOCKER_BUILDKIT: 1
        run: |
          chmod +x ./scripts/build-docker.sh
          ./scripts/build-docker.sh rel

      - name: Push image to GHCR
        env:
          GHCR_OWNER: ${{ steps.repo-owner.outputs.owner }}
        run: |
          docker tag ghcr.io/${GHCR_OWNER}/${{ env.IMAGE_NAME_DEV }}:latest \
            ${{ steps.reg-owner.outputs.path }}/${{ env.IMAGE_NAME_DEV }}:${{ steps.update-version.outputs.docker_tag }}
          docker push ${{ steps.reg-owner.outputs.path }}/${{ env.IMAGE_NAME_DEV }}:latest
          docker push ${{ steps.reg-owner.outputs.path }}/${{ env.IMAGE_NAME_DEV }}:${{ steps.update-version.outputs.docker_tag }}

      - name: Create or update Git tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.update-version.outputs.new_version }}'
            const tagName = `v${version}`
            const sha = '${{ steps.commit-version.outputs.new_commit_sha }}'

            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              })

              if (existing.data.object.sha !== sha) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`
                })

                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha
                })
              }
            } catch (e) {
              if (e.status === 404) {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha
                })
              } else {
                throw e
              }
            }

