---
# Builds the dev and release images on PRs that can break them, without pushing.
name: Docker

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "Docker/**"
      - "scripts/build-docker.sh"
      - "src/*/package.xml"
      - "src/rwifi_slam_ros2/requirements.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [dev, rel]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/dockerfile.${{ matrix.image }}
          push: false
          load: ${{ matrix.image == 'rel' }}
          tags: rwifi_slam:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test release image
        if: matrix.image == 'rel'
        run: |
          docker run --rm rwifi_slam:rel bash -c '
            ros2 pkg executables rwifi_slam_ros2 &&
            ros2 pkg executables wifi_rtt_interface &&
            python3 -c "import rwifi_slam_ros2.rwifi_slam_ros2_node, wifi_rtt_interface.simulation_backend"'
