---
# Publishes a release when a version tag is pushed:
#   ./scripts/bump-version.sh 0.14.0 && git commit -am "Release 0.14.0"
#   git tag v0.14.0 && git push origin main v0.14.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish image and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          manifest=src/rwifi_slam_ros2/package.xml
          version=$(grep -oP '<version>\K[^<]+' "$manifest")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$manifest::package version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rwifi_slam" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/dockerfile.rel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rel
          cache-to: type=gha,scope=rel,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
