---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml so a release is tested exactly like a PR.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the caller's ref).
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Check package versions
        run: ./scripts/check-versions.sh

  build-and-test:
    name: Build and test (ROS 2 Jazzy, ${{ matrix.deps }} deps)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    strategy:
      fail-fast: false
      matrix:
        # latest: newest versions requirements.txt allows; minimum: its lower bounds.
        deps: [latest, minimum]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # GUI and teleop tools are only needed by the launch files, not by the tests.
      ROSDEP_SKIP_KEYS: rviz2 rviz_imu_plugin imu_tools teleop_twist_keyboard nav2_lifecycle_manager
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          rosdep update
          rosdep install --from-paths src --ignore-src -y --skip-keys "$ROSDEP_SKIP_KEYS"

      - name: Install Python dependencies
        run: |
          requirements=src/rwifi_slam_ros2/requirements.txt
          if [ "${{ matrix.deps }}" = minimum ]; then
            sed -nE 's/^([A-Za-z0-9_.-]+)>=([^,]+).*/\1==\2/p' "$requirements" > /tmp/minimum.txt
            requirements=/tmp/minimum.txt
          fi
          python3 -m pip install --break-system-packages -r "$requirements"
          python3 -m pip list 2>/dev/null | grep -i -E '^(g2opy|pyoctomap) '

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure

      - name: Test summary
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.deps }}
          path: |
            build/*/pytest.xml
            build/*/test_results/
            log/
          if-no-files-found: ignore
          retention-days: 14
