---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

  build-and-test:
    name: Build and test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # GUI and teleop tools are only needed by the launch files, not by the tests.
      ROSDEP_SKIP_KEYS: rviz2 rviz_imu_plugin imu_tools teleop_twist_keyboard nav2_lifecycle_manager
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          rosdep update
          rosdep install --from-paths src --ignore-src -y --skip-keys "$ROSDEP_SKIP_KEYS"

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r src/rwifi_slam_ros2/requirements.txt

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure

      - name: Test summary
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/*/pytest.xml
            build/*/test_results/
            log/
          if-no-files-found: ignore
          retention-days: 14
