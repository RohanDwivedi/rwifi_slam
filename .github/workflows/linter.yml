---
name: Lint and Code Review

# IMPORTANT: This workflow must be included in branch protection rules
# See docker-build-release.yml for branch protection configuration details
# Required status check name: "Run Linters" (matches job name below)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Docker/requirements-dev.txt

      - name: Run Black formatter check
        id: black
        run: |
          black --check --diff src/

      - name: Run isort check
        id: isort
        run: |
          isort --check-only --diff src/

      - name: Run flake8
        id: flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run pydocstyle
        id: pydocstyle
        run: |
          pydocstyle src/ --convention=google --add-ignore=D100,D104

      - name: Run mypy
        id: mypy
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run yamllint
        id: yamllint
        run: |
          yamllint src/

      - name: Comment PR with lint results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              black: '${{ steps.black.outcome }}',
              isort: '${{ steps.isort.outcome }}',
              flake8: '${{ steps.flake8.outcome }}',
              pydocstyle: '${{ steps.pydocstyle.outcome }}',
              mypy: '${{ steps.mypy.outcome }}',
              yamllint: '${{ steps.yamllint.outcome }}',
            };

            const failed = Object.entries(results).filter(([_, status]) => status === 'failure');
            const passed = Object.entries(results).filter(([_, status]) => status === 'success');

            let comment = '## 🔍 Linting Results\n\n';

            if (passed.length > 0) {
              comment += '### ✅ Passed Checks\n';
              passed.forEach(([tool, _]) => {
                comment += `- ✅ ${tool}\n`;
              });
              comment += '\n';
            }

            if (failed.length > 0) {
              comment += '### ❌ Failed Checks\n';
              failed.forEach(([tool, _]) => {
                comment += `- ❌ ${tool}\n`;
              });
              comment += '\n';
              comment += '**Please fix the linting errors before merging.**\n\n';
              comment += 'To fix formatting issues automatically, run:\n';
              comment += '```bash\n';
              comment += 'python3 -m black src/ && python3 -m isort src/\n\n';
              comment += 'python3 -m yamllint src/\n';
              comment += '```\n';
            } else {
              comment += '🎉 All linting checks passed!\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
