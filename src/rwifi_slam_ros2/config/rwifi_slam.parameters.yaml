---
/rwifi_slam_node:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    odom_frame: odom
    imu_frame: chassis_imu
    depth_frame: camera_pseudo_depth
    wifi_frame: chassis_wifi
    trajectory_keep_history: 100
    pose_estimator:
      initial_covar_mat_diag: [0.5, 0.5, 0.5, 0.5, 0.5, 0.01, 0.05, 0.05]
      imu:
        gravity: 9.81
        gyro_noise: 0.1
        gyro_random_walk: 0.001
        accel_random_walk: 0.005
      odometry:
        enabled: true
        meas_noise_covar_diag: [0.05, 0.05, 0.001]
