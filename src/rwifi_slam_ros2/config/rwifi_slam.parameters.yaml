---
/rwifi_slam_node:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    odom_frame: odom
    imu_frame: chassis_imu
    depth_frame: camera_pseudo_depth
    wifi_frame: chassis_wifi
    trajectory_keep_history: 100
    pose_estimator:
      initial_covar_mat_diag: [0.01, 0.01, 0.01, 0.01, 0.27, 0.04, 0.04, 0.0025]
      imu:
        gyro_noise: 1.0  # rad/s / √Hz
        accel_noise: 0.5  # m/s² / √Hz
        gyro_random_walk: 0.0  # rad/s² / √Hz
        accel_random_walk: 0.0  # m/s³ / √Hz
      odometry:
        enabled: true
        # [x, y, vx, vy, yaw] (default if wheel odom doesn't provide covariance)
        meas_noise_covar_diag: [0.01, 0.01, 0.01, 0.01, 0.05]
