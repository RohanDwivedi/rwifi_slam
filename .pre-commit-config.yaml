# Pre-commit hooks for formatting and linting. CI runs exactly these hooks.
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files

exclude: ^src/simulation/isaac_sim_dev/assets/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^src/simulation/isaac_sim_dev/configs/warehouse_nlos_map\.pkl$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: black (format)
        args: [--config, Docker/pyproject.toml]
        files: ^src/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (imports)
        args: [--settings-path, Docker/pyproject.toml]
        files: ^src/

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (lint)
        args: [--config, Docker/.flake8]
        files: ^src/

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstrings)
        args: [--config, Docker/pyproject.toml]
        files: ^src/

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint
        args: [-c, Docker/.yamllint]
        files: ^(src/|\.github/)

  # actionlint shells out to shellcheck for run: blocks. This packaging pins shellcheck into the
  # hook's environment, so local runs check exactly what CI checks.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]
