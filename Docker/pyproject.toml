[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | isaac-sim-6.0
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
  "*/build/*",
  "*/dist/*",
  "*/.venv/*",
  "*/__pycache__/*",
  "*/isaac-sim-6.0/*"
]

[tool.pydocstyle]
match-dir = '^(?!.*(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|build|dist|isaac-sim-6\.0|__pycache__)).*'

